<!DOCTYPE html>

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        /* Focus ring animation for input */
        .input-ring:focus-within {
            box-shadow: 0 0 0 2px var(--tw-colors-primary-container);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased min-h-screen flex items-center justify-center p-container-margin relative overflow-hidden">
<!-- Decorative background elements -->
<div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary-fixed opacity-30 blur-[80px] -z-10"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40vw] h-[40vw] rounded-full bg-secondary-container opacity-40 blur-[80px] -z-10"></div>
<main class="w-full max-w-[400px] glass-panel rounded-xl shadow-[0_8px_24px_rgba(13,59,46,0.05)] p-lg flex flex-col items-center animate-[fadeIn_0.5s_ease-out]">
<!-- Logo & Brand Header -->
<div class="flex flex-col items-center mb-xl">
<div class="w-16 h-16 rounded-full bg-primary-container text-on-primary flex items-center justify-center mb-md shadow-lg">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
</div>
<h1 class="font-display-currency text-display-currency text-primary mb-xs">MoneyTrack</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Track every rupee</p>
</div>
<!-- Login Form -->
<form class="w-full flex flex-col gap-md" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-xs" for="phone">Mobile Number</label>
<div class="relative flex items-center bg-surface-bright rounded-lg input-ring transition-shadow duration-200">
<span class="material-symbols-outlined absolute left-md text-outline">call</span>
<span class="absolute left-[44px] text-body-lg font-body-lg text-on-surface border-r border-surface-variant pr-2">+91</span>
<input class="w-full bg-transparent border-none focus:ring-0 font-body-lg text-body-lg text-on-surface pl-[92px] pr-md py-md rounded-lg placeholder:text-outline-variant" id="phone" placeholder="Enter your number" required="" type="tel"/>
</div>
</div>
<button class="w-full bg-primary-container text-on-primary font-headline-md text-headline-md py-md rounded-lg shadow-[0_4px_12px_rgba(13,59,46,0.1)] hover:bg-primary transition-colors active:scale-95 duration-150 flex items-center justify-center gap-sm mt-sm" type="submit">
                Get OTP
                <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="w-full flex items-center gap-md my-lg">
<div class="h-px bg-surface-variant flex-1"></div>
<span class="font-label-muted text-label-muted text-outline">OR</span>
<div class="h-px bg-surface-variant flex-1"></div>
</div>
<!-- Social Login -->
<button class="w-full bg-surface-bright border border-surface-variant text-on-surface font-body-lg text-body-lg py-sm px-md rounded-lg flex items-center justify-center gap-md hover:bg-surface-container-low transition-colors active:scale-95 duration-150 shadow-sm">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
            Continue with Google
        </button>
<!-- Footer Link -->
<div class="mt-xl text-center">
<span class="font-body-md text-body-md text-on-surface-variant">Don't have an account?</span>
<a class="font-headline-md text-headline-md text-primary ml-xs hover:underline decoration-2 underline-offset-4" href="#">Sign up</a>
</div>
</main>
<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
